<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Banking</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color:pink;
        }
        .register-box {
            max-width: 450px;
            margin: 70px auto;
            padding: 25px;
            background: blue;
            box-shadow: 0 0 10px rgba(0,0,0,0.12);
            border-radius: 10px;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="register-box">
    <h2>Create Your Account</h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/register" method="POST">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" required class="form-control" placeholder="Choose a username">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" required class="form-control" placeholder="Enter your email">
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" required class="form-control" placeholder="Choose a strong password">
        </div>

        <button type="submit" class="btn btn-success w-100">Register</button>

        <p class="mt-3 text-center">
            Already have an account? <a href="/login">Login</a>
        </p>
    </form>
</div>

</body>
</html>
