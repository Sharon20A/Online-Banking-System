<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends "base.html" %}
{% block content %}
<h2>Deposit Funds</h2>
<form method="POST">
    <div>
        <label for="amount">Amount ($):</label>
        <input type="number" step="0.01" name="amount" required min="0.01">
    </div>
    <button type="submit">Deposit</button>
</form>
{% endblock %}
</body>
</html>
