<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background:grey;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .nav-bar {
            background:blue;
            padding: 15px;
        }
        .nav-bar h2 {
            color: #343a40;
            margin: 0;
        }
    </style>

</head>
<body>

    <div class="nav-bar">
        <h2>Dashboard</h2>
    </div>

    <div class="container mt-5">

        <div class="card p-4">
            <h3>Welcome back!</h3>

            <p><strong>User ID:</strong> {{ account.user_id }}</p>
            <p><strong>Balance:</strong> ${{ account.balance }}</p>

            <hr>
            <p><strong>Account Number:</strong> {{ account.account_number }}</p>
            <a href="/transfer" class="btn btn-primary mb-2">Transfer Money</a>
            <a href="/withdraw" class="btn btn-warning mb-2">Withdraw</a>
            <a href="/transactions" class="btn btn-secondary mb-2">View Transactions</a>
            <a href="/add_funds/500" class="btn btn-success mb-2">Add $500</a>

            <br><br>

            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>

    </div>

</body>
</html>
