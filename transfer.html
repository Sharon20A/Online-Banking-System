<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer Money - Online Banking</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("static/transf1.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            background-size:120% auto;
            background-size: auto 120%;
        }
        .transfer-box {
            max-width: 500px;
            margin: 70px auto;
            padding: 25px;
            background: lightblue;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        .btn-custom {
            width: 100%;
        }
    </style>
</head>
<body>

<div class="transfer-box">
    <h2>Transfer Money</h2>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/transfer" method="POST">

        <div class="mb-3">
            <label class="form-label">Receiver User ID</label>
            <input type="number" name="receiver_id" required class="form-control" placeholder="Enter receiver's user ID">
        </div>

        <div class="mb-3">
            <label class="form-label">Amount</label>
            <input type="number" name="amount" required step="0.01" min="1" class="form-control" placeholder="Enter amount to transfer">
        </div>

        <button type="submit" class="btn btn-primary btn-custom">Send Money</button>

        <a href="/dashboard" class="btn btn-secondary btn-custom mt-2">Back to Dashboard</a>
    </form>
</div>

</body>
</html>
